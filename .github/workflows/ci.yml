name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        env:
          PROOFRAIL_ADMIN_KEY: ci-admin-key
          PROOFRAIL_SIGNING_KEYS: k1:ci-signing-secret-32chars-padding
          PROOFRAIL_SIGNING_KEY_CURRENT: k1
          PROOFRAIL_DB_PATH: /tmp/proofrail_ci.sqlite3
          PROOFRAIL_STORE_DIR: /tmp/proofrail_store_ci
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t proofrail:ci .

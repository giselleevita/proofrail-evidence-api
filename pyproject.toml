[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofrail-evidence-api"
version = "1.0.0"
description = "Audit-grade sanctions screening evidence API."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Giselle Evita Koch" }]
license = { file = "LICENSE" }
dependencies = [
  "requests>=2.31",
  # API service (SaaS core)
  "fastapi>=0.112.0,<0.142",
  "uvicorn>=0.30.0",
  # Postgres backend (used when PROOFRAIL_DB_URL is set)
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  # S3-compatible object store (used when PROOFRAIL_S3_BUCKET is set)
  "boto3>=1.34.0",
  # Webhooks deliveries
  "httpx>=0.27.0",
  # PDF exports for evidence packs
  "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]
api = [
  "fastapi>=0.112.0,<0.142",
  "uvicorn>=0.30.0",
]

[project.scripts]
proofrail-evidence-api = "ProofRail.service.app:main"
proofrail-api = "ProofRail.service.app:main"
proofrail-worker = "ProofRail.service.worker:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ProofRail*"]

[tool.setuptools.package-data]
"ProofRail.service" = ["analyst_console/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".venv",
  ".claude",
  "output",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["ProofRail", "proofrail"]

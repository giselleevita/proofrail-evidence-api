 [build-system]
 requires = ["setuptools>=68", "wheel"]
 build-backend = "setuptools.build_meta"
 
 [project]
 name = "proofrail"
 version = "0.1.0"
description = "Audit-grade sanctions screening evidence API."
readme = "README.md"
 requires-python = ">=3.11"
 authors = [{ name = "ProofRail contributors" }]
 license = { text = "UNLICENSED" }
 dependencies = [
   "requests>=2.31",
  # API service (SaaS core)
  "fastapi>=0.112.0",
  "uvicorn>=0.30.0",
 ]
 
 [project.optional-dependencies]
 dev = [
   "ruff>=0.6.0",
  "httpx>=0.27.0",
 ]
api = [
  # Extra marker for service-only installs (kept for convenience)
  "fastapi>=0.112.0",
  "uvicorn>=0.30.0",
]
 
 [project.scripts]
proofrail-api = "ProofRail.service.app:main"
 
 [tool.setuptools]
 include-package-data = true
 
 [tool.setuptools.packages.find]
 where = ["."]
include = ["ProofRail*"]
 
 [tool.ruff]
 target-version = "py311"
 line-length = 100
exclude = [
  ".venv",
  ".claude",
  "output",
  "spike2_artifacts",
  "tests/tmp_spike2",
  "tmp",
]
 
 [tool.ruff.lint]
 select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["ProofRail", "proofrail"]
 
